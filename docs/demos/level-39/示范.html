<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第39关 · 六步三星示范</title><style>body{margin:0;background:#e8effb;color:#263e6a;font:17px/1.7 -apple-system,'PingFang SC',sans-serif}main{max-width:760px;margin:24px auto;padding:0 20px}h1{font-size:27px;margin-bottom:4px}p{margin:8px 0}img{display:block;max-width:100%;max-height:65vh;margin:16px auto;border-radius:16px}nav{display:flex;gap:10px;justify-content:center}button{background:#354fbe;color:white;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.4}small{color:#536883}#count{text-align:center}</style><main><h1>第39关「霜蕊」</h1><p>6步三星。先消列，再消行，最后完成左侧中宫。</p><small>行从上往下数，列从左往右数。金色格是本步落点；图片为真实游戏画面上标注。</small><h2 id="title"></h2><p id="where"></p><p id="why"></p><img id="picture"><nav><button id="prev">上一步</button><button id="auto">自动演示</button><button id="next">下一步</button></nav><p id="count" aria-live="polite"></p><p><strong>注意：</strong>破冰只去掉冰壳，格子里的蓝块还在。第3步用完第一组后，才会换成第二组。最后消九宫时，两朵相邻花都会再被浇一次。</p></main><script>const steps=[{"title":"第 1 步 · 右侧竖两格","where":"第 2 列，第 8–9 行","why":"先填第二列的最下两格。","img":"step-1.png"},{"title":"第 2 步 · 左侧单格","where":"第 6 行，第 2 列","why":"继续补第二列的空位。","img":"step-2.png"},{"title":"第 3 步 · 中间单格","where":"第 4 行，第 2 列","why":"第二列完成：破冰，左花浇水 1 次。","img":"step-3.png"},{"title":"第 4 步 · 中间横四格","where":"第 5 行，第 3–6 列","why":"第五行完成：破冰，右花浇水 1 次。","img":"step-4.png"},{"title":"第 5 步 · 右侧 2×3 长方块","where":"第 4–6 行，第 2–3 列","why":"补左侧中宫，留下最左下角一格。","img":"step-5.png"},{"title":"第 6 步 · 左侧单格","where":"第 6 行，第 1 列","why":"左侧中宫完成：同时浇花，两朵开放！","img":"step-6.png"},{"title":"6 步通关 · 三星","where":"两朵花都已开放","why":"已用开发源码实际落子流程和 1.4.0 加固版规则分别验证。","img":"result.png"}];let i=0,timer;const el=id=>document.getElementById(id);function show(){const s=steps[i];el('title').textContent=s.title;el('where').textContent=s.where;el('why').textContent=s.why;el('picture').src=s.img;el('picture').alt=s.title+'：'+s.where;el('count').textContent=(i+1)+' / '+steps.length;el('prev').disabled=i===0;el('next').disabled=i===steps.length-1}function stop(){clearInterval(timer);timer=null;el('auto').textContent='自动演示'}el('prev').onclick=()=>{stop();i--;show()};el('next').onclick=()=>{stop();i++;show()};el('auto').onclick=()=>{if(timer){stop();return}if(i===steps.length-1)i=0;show();el('auto').textContent='暂停';timer=setInterval(()=>{if(i===steps.length-1){stop();return}i++;show()},4000)};show();</script></html>
