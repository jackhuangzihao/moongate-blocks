e(api)) write(api, key, value);\n  return !hasPending(api);\n}\nfunction hasPending(api) { return queue(api).size > 0; }\nmodule.exports = { read, write, retry, hasPending };\n","./js/platform/analytics":"// 自定义分析上报。事件和字段要先在小游戏后台「数据分析 → 自定义分析 → 事件管理」里建好，\n// 名称与下面完全一致；没建或客户端不支持时，上报会被静默忽略，不影响游戏。\nfunction report(wxApi, event, data) {\n  try { if (wxApi && typeof wxApi.reportEvent === 'function') wxApi.reportEvent(event, data); }\n  catch (_) { /* 统计失败不能打断对局。 */ }\n}\nmodule.exports = { report };\n","./js/platform/feedback":"const storage = require('../persistence/storage');\nconst DEFAULT_SETTINGS = {\n  soundEnabled: true,\n  musicEnabled: true,\n  vibrationEnabled: true\n};\n\n// 原创 112 BPM 循环：短钩子旋律、轻鼓点与低音形成持续节奏感，\n// 音量保持在反馈音效之下，避免长时间游玩产生听觉疲劳。\nconst BGM_SRC = 'assets/audio/bgm-v2.wav';\nconst BGM_VOLUME = 0.3;\n\nfunction loadBoolean(key, fallback) {\n  const value = storage.read(wx, key);\n  return typeof value === 'boolean' ? value : fallback;\n}\n\nconst settings = {\n  soundEnabled: loadBoolean('fangcunSoundEnabled', DEFAULT_SETTINGS.soundEnabled),\n  musicEnabled: loadBoolean('fangcunMusicEnabled', DEFAULT_SETTINGS.musicEnabled),\n  vibrationEnabled: loadBoolean('fangcunVibrationEnabled', DEFAULT_SETTINGS.vibrationEnabled)\n};\n\n// 不抢占用户自己正在放的音乐；同时整体遵守系统静音键。\nif (wx.setInnerAudioOption) {\n  try {\n    wx.setInnerAudioOption({ mixWithOther: true, obeyMuteSwitch: true, fail() {} });\n  } catch (error) {\n    // 旧基础库不支持时保持默认行为。\n  }\n}\n\nfunction createAudio(src, volume, useWebAudio) {\n  if (!wx.createInnerAudioContext) return null;\n  // useWebAudioImplement 走 WebAudio，整段解码进内存，短音效的首次播放延迟明显更低。\n  // 但它只适合短音效：循环背景音乐整段解码会占用大量内存，\n  // 因此背景音乐走默认的流式实现。\n  let audio;\n  try {\n    audio = useWebAudio\n      ? wx.createInnerAudioContext({ useWebAudioImplement: true })\n      : wx.createInnerAudioContext();\n  } catch (error) {\n    try { audio = wx.createInnerAudioContext(); } catch (_) { return null; }\n  }\n  audio.src = src;\n  audio.volume = volume;\n  audio.loop = false;\n  audio.autoplay = false;\n  audio.obeyMuteSwitch = true;\n  if (audio.onError) audio.onError(() => {});\n  return audio;\n}\n\nfunction createEffect(src, volume) {\n  return createAudio(src, volume, true);\n}\n\n// 统一为柔和木音与短磬声：常用操作起音轻，奖励逐级清晰。\n// 连消仅用 D 的基音与八度，升调仍落在 D 大调内；破冰收住高频噪声。\n// 通关、结束旋律和背景音乐保持不变。\nconst sounds = {\n  tap: createEffect('assets/audio/tap.wav', 0.34),\n  place: createEffect('assets/audio/place.wav', 0.32),\n  undo: createEffect('assets/audio/undo.wav', 0.26),\n  over: createEffect('assets/audio/over.wav', 0.26),\n  clear: createEffect('assets/audio/clear.wav', 0.502),\n  ice: createEffect('assets/audio/ice.wav', 0.48),\n  bloom: createEffect('assets/audio/bloom.wav', 0.32),\n  combo: createEffect('assets/audio/combo.wav', 0.38),\n  energy: createEffect('assets/audio/energy.wav', 0.543),\n  win: createEffect('assets/audio/win.wav', 0.35)\n};\n\n// D 大调调内阶梯（升 0 / 2 / 4 / 7 个半音）。800 局模拟显示只有约 3% 的消除能爬到\n// 第二级以上，所以间距拉宽，让罕见的高连消听得见，同时不与背景音乐打架。\n// playbackRate 同时改变速度和音高，短音效上正是想要的效果。\nconst PITCH_STEPS = [1, 1.122, 1.26, 1.498];\n\nlet suspended = false;\n\nfunction play(name, step) {\n  if (suspended || !settings.soundEnabled) return;\n  const audio = sounds[name];\n  if (!audio) return;\n  const rate = PITCH_STEPS[Math.min(PITCH_STEPS.length - 1, Math.max(0, step || 0))];\n  try {\n    // stop() 已经把播放位置复位，再调 seek(0) 在部分机型上会抛错并吞掉这次播放。\n    audio.stop();\n    audio.playbackRate = rate;\n    audio.play();\n  } catch (error) {\n    // 模拟器或静音环境不支持音频时，不影响游戏继续运行。\n  }\n}\n\nfunction vibrate(type) {\n  if (suspended || !settings.vibrationEnabled || !wx.vibrateShort) return;\n  try { wx.vibrateShort({ type, fail() {} }); } catch (_) { /* Device feedback is optional. */ }\n}\n\nfunction buttonTap() {\n  play('tap', 0);\n}\n\nfunction placement() {\n  // 一局要听 25～50 次，落子音刻意保持无音高变化、存在感最低。\n  play('place', 0);\n}\n\n// 撤销：短促的下行木音，读作\"退回一步\"。\nfunction undoMove() {\n  play('undo', 0);\n  vibrate('light');\n}\n\n// 破冰：比普通消除更亮更短，让\"冰碎了\"和\"消掉一行\"区分开。\nfunction iceBreak() {\n  play('ice', 0);\n  vibrate('medium');\n}\n\n// 花苞真正开放时的一小段上行木音，轻于通关，不随连消升调。\nfunction bloom() {\n  play('bloom', 0);\n  vibrate('light');\n}\n\n// 一局或一关的结果。通关和刷新纪录用同一个最有分量的声音；\n// 普通结束和闯关失败都用柔和的收束音，不做成惩罚。\nfunction result(success) {\n  play(success ? 'win' : 'over', 0);\n  vibrate(success ? 'heavy' : 'light');\n}\n\nfunction elimination(combo, energyCharged, regionCount) {\n  if (energyCharged) {\n    play('energy', 0);\n    vibrate('heavy');\n    return;\n  }\n  // 阶梯同时吃\"连消手数\"和\"一手消掉几个区域\"。只按连消的话，\n  // 平均最大 Combo 只有 1.4，阶梯几乎永远停在第一级。\n  const regions = regionCount || 1;\n  const level = Math.min(4, Math.max(0, (combo - 1) + (regions - 1)));\n  if (level > 0) {\n    play('combo', level - 1);\n    vibrate('medium');\n  } else {\n    play('clear', 0);\n    vibrate('medium');\n  }\n}\n\nlet bgm = null;\n\nfunction ensureMusic() {\n  if (bgm) return bgm;\n  bgm = createAudio(BGM_SRC, BGM_VOLUME, false);\n  if (bgm) bgm.loop = true;\n  return bgm;\n}\n\nfunction playMusic() {\n  if (suspended || !settings.musicEnabled) return;\n  const audio = ensureMusic();\n  if (!audio) return;\n  try {\n    audio.play();\n  } catch (error) {\n    // 音频文件缺失或解码失败时静默忽略，不影响游戏。\n  }\n}\n\nfunction pauseMusic() {\n  if (!bgm) return;\n  try {\n    bgm.pause();\n  } catch (error) {\n    // 同上。\n  }\n}\n\n// 切后台必须暂停，否则音乐会在微信之外继续响。\nfunction suspend() {\n  suspended = true;\n  for (const audio of Object.values(sounds)) { try { if (audio) audio.stop(); } catch (_) {} }\n  pauseMusic();\n}\n\nfunction resume() {\n  suspended = false;\n  playMusic();\n}\n\nfunction setSoundEnabled(enabled) {\n  settings.soundEnabled = Boolean(enabled);\n  if (!settings.soundEnabled) for (const audio of Object.values(sounds)) { try { if (audio) audio.stop(); } catch (_) {} }\n  storage.write(wx, 'fangcunSoundEnabled', settings.soundEnabled);\n}\n\nfunction setMusicEnabled(enabled) {\n  settings.musicEnabled = Boolean(enabled);\n  if (settings.musicEnabled) playMusic();\n  else pauseMusic();\n  storage.write(wx, 'fangcunMusicEnabled', settings.musicEnabled);\n}\n\nfunction setVibrationEnabled(enabled) {\n  settings.vibrationEnabled = Boolean(enabled);\n  storage.write(wx, 'fangcunVibrationEnabled', settings.vibrationEnabled);\n}\n\nmodule.exports = {\n  settings,\n  placement,\n  buttonTap,\n  undoMove,\n  iceBreak,\n  bloom,\n  result,\n  elimination,\n  playMusic,\n  pauseMusic,\n  suspend,\n  resume,\n  setSoundEnabled,\n  setMusicEnabled,\n  setVibrationEnabled\n};\n","./js/platform/leaderboard":"const { MODES, MODE_ORDER, COLORS } = require('../config');\nconst { roundedRect } = require('../views/canvas-ui');\nlet api, context, opened = false, modeIndex = 0, status = '', generation = 0;\nlet authorized = false;\n\nfunction post(message) { context.postMessage(message); }\nfunction connect(wx) {\n  api = wx;\n  try {\n    if (!context && wx.getOpenDataContext) context = wx.getOpenDataContext();\n    return Boolean(context);\n  } catch (_) { return false; }\n}\nfunction sync(wx, scores) {\n  if (!connect(wx)) return;\n  const values = {};\n  MODE_ORDER.forEach(id => {\n    if (Number.isSafeInteger(scores[id]) && scores[id] > 0) values[MODES[id].bestKey] = scores[id];\n  });\n  try { post({ type: 'sync', scores: values }); } catch (_) { /* 下次结算、回前台或打开榜单再同步。 */ }\n}\nfunction actions(layout) {\n  const x = 24, width = layout.width - 48;\n  const top = Math.max(layout.safeTop + 100, layout.settingsY + 52);\n  const bottom = layout.height - layout.safeBottom - 68;\n  return {\n    previousMap: { x, y: top, width: 48, height: 48 },\n    nextMap: { x: layout.width - 72, y: top, width: 48, height: 48 },\n    list: { x, y: top + 64, width, height: Math.max(100, bottom - top - 128) },\n    previousPage: { x, y: bottom - 48, width: 76, height: 44 },\n    refresh: { x: layout.width / 2 - 40, y: bottom - 48, width: 80, height: 44 },\n    nextPage: { x: layout.width - 100, y: bottom - 48, width: 76, height: 44 },\n    close: { x: layout.width / 2 - 80, y: bottom + 4, width: 160, height: 48 }\n  };\n}\nfunction show(layout) {\n  if (!opened || !authorized) return;\n  status = '';\n  const list = actions(layout).list;\n  try { post({ type: 'show', key: MODES[MODE_ORDER[modeIndex]].bestKey,\n    width: list.width, height: list.height, colors: COLORS }); }\n  catch (_) { status = '暂时无法加载，请点击重试'; }\n}\nfunction authorize(layout) {\n  const token = ++generation;\n  status = '正在请求好友排行权限…';\n  const success = () => { if (opened && token === generation) { authorized = true; show(layout); } };\n  const fail = () => { if (opened && token === generation) status = '需要好友权限，请点击重试开启'; };\n  if (!api.getSetting || !api.authorize) { status = '请在微信中查看好友排行'; return; }\n  api.getSetting({ success(result) {\n    if (!opened || token !== generation) return;\n    const granted = result.authSetting['scope.WxFriendInteraction'];\n    if (granted === true) success();\n    else if (granted === false && api.openSetting) {\n      api.openSetting({ success: result => result.authSetting['scope.WxFriendInteraction'] ? success() : fail(), fail });\n    } else api.authorize({ scope: 'scope.WxFriendInteraction', success, fail });\n  }, fail });\n}\nfunction open(wx, layout, mode, scores) {\n  if (!connect(wx)) { if (wx.showToast) wx.showToast({ title: '请在微信中查看好友排行', icon: 'none' }); return; }\n  opened = true; authorized = false; modeIndex = Math.max(0, MODE_ORDER.indexOf(mode));\n  sync(wx, scores);\n  authorize(layout);\n}\nfunction close() {\n  opened = false; authorized = false; status = ''; generation++;\n  try { if (context) post({ type: 'hide' }); } catch (_) {}\n}\nfunction hit(point, layout) {\n  for (const [name, rect] of Object.entries(actions(layout))) {\n    if (name === 'list' || point.x \u003c rect.x || point.x > rect.x + rect.width || point.y \u003c rect.y || point.y > rect.y + rect.height) continue;\n    return { rect, action() {\n      if (name === 'close') close();\n      else if (name === 'previousMap' || name === 'nextMap') {\n        modeIndex = (modeIndex + (name === 'nextMap' ? 1 : MODE_ORDER.length - 1)) % MODE_ORDER.length; show(layout);\n      } else if (name === 'refresh') { if (authorized) show(layout); else authorize(layout); }\n      else if (authorized && !status) { try { post({ type: 'page', delta: name === 'nextPage' ? 1 : -1 }); } catch (_) { status = '暂时无法加载，请点击重试'; } }\n    } };\n  }\n  return null;\n}\nfunction draw(ctx, layout) {\n  const a = actions(layout);\n  ctx.fillStyle = COLORS.background; ctx.fillRect(0, 0, layout.width, layout.height);\n  ctx.textAlign = 'center'; ctx.fillStyle = COLORS.text; ctx.font = '600 24px sans-serif';\n  ctx.fillText('好友排行', layout.width / 2, a.previousMap.y - 24);\n  ctx.font = '600 18px sans-serif'; ctx.fillText(MODES[MODE_ORDER[modeIndex]].title, layout.width / 2, a.previousMap.y + 30);\n  const labels = { previousMap: '‹', nextMap: '›', previousPage: '上一页', nextPage: '下一页', refresh: '重试 / 刷新', close: '返回' };\n  for (const [name, label] of Object.entries(labels)) {\n    const r = a[name]; ctx.fillStyle = COLORS.panel; roundedRect(ctx, r.x, r.y, r.width, r.height, 18); ctx.fill();\n    ctx.fillStyle = COLORS.text; ctx.font = '15px sans-serif'; ctx.fillText(label, r.x + r.width / 2, r.y + r.height / 2 + 5);\n  }\n  if (status) { ctx.font = '14px sans-serif'; ctx.fillText(status, layout.width / 2, a.list.y + 70, a.list.width); }\n  else ctx.drawImage(context.canvas, a.list.x, a.list.y, a.list.width, a.list.height);\n}\nmodule.exports = { open, close, sync, actions, hit, draw, isOpen: () => opened };\n","./js/platform/player-feedback":"const { COLORS } = require('../config');\n\n// 微信要求玩家直接点击原生按钮；不能用 Canvas 点击模拟打开反馈页。\nfunction createPlayerFeedback(wxApi, onTap) {\n  let button = null;\n  let attempted = false;\n  function sync(rect) {\n    if (!rect) {\n      if (button) { button.destroy(); button = null; }\n      attempted = false;\n      return;\n    }\n    if (attempted) return;\n    attempted = true;\n    if (typeof wxApi.createFeedbackBut  { challenge: false, gravity: true, decor: (state.decor || []).slice(), query: 'mode=gravity',\n      heading: '落玉庭 · 连锁挑战', stat: `${result.score} 分`, detail: `最长 ${result.chain} 连锁 · 你能超过吗？`,\n      title: `落玉庭这局 ${result.score} 分、${result.chain} 连锁，你能超过吗？` };\n  }\n  if (state.screen !== 'playing' || !state.gameOver || (state.challenge && !state.challenge.won)) return null;\n  const run = state.challenge, level = run && challenges.level(run.level);\n  const daily = run && validDate(run.dailyDate) ? run.dailyDate : '';\n  return run ? {\n    challenge: true, level: daily ? null : level.number, stars: challenges.stars(run),\n    query: challengeQuery(run, run.history.length),\n    heading: daily ? `每日精选 · ${daily.slice(5).replace('-', '月')}日` : `第 ${level.number} 关 · ${level.title}`,\n    stat: `${run.history.length} 步通关`, detail: `${challenges.stars(run)} 星达成 · 你能用更少步吗？`,\n    title: daily ? `${daily} 每日精选，我用 ${run.history.length} 步完成，你能更少吗？`\n      : `第 ${level.number} 关，${run.history.length} 步 ${challenges.stars(run)} 星，你能比我更少吗？`\n  } : {\n    challenge: false, heading: `清雅庭院 · ${MODES[state.mode].title}`, decor: (state.decor || []).slice(),\n    stat: `${state.score} 分`, detail: state.score > state.startingBest ? '刷新个人纪录 · 方寸之间再进一步' : '落子成局 · 来庭院里坐一会儿',\n    title: `这局${MODES[state.mode].title} ${state.score} 分，你能超过吗？`\n  };\n}\n\nfunction helpCard(state) {\n  const run=state.challenge;\n  if(state.screen!=='playing' || !state.gameOver || !run || !run.ended || run.won)return null;\n  const level=challenges.level(run.level);\n  return {challenge:true,help:true,heading:run.dailyDate?`${run.dailyDate} · 每日精选`:`第 ${level.number} 关 · ${level.title}`,\n    query:challengeQuery(run,null)+'&help=1',title:run.dailyDate?`${run.dailyDate} 每日精选把我难住了，你能找到解法吗？`:`第 ${level.number} 关把我难住了，你能找到解法吗？`,\n    stat:challenges.goal(level),detail:'朋友从初始棋盘尝试 · 图片为我的局面',\n    progress:`目标 ${Math.min(run.progress,level.target)}/${level.target} · 剩余 ${Math.max(0,level.limit-run.history.le el: daily ? null : level.number, stars: 0, query: challengeQuery(run),\n      heading: daily ? `每日精选 · ${daily.slice(5).replace('-', '月')}日` : `第 ${level.number} 关 · ${level.title}`,\n      stat: benchmarkText(run) || (daily ? '今天，一起解这一题' : '同一题，试试你的解法'), detail: challenges.goal(level),\n      title: daily ? `${daily} 每日精选，来试试你的解法？` : `方寸九宫第 ${level.number} 关 · ${level.title}，来试试你的解法？` };\n  }\n  const mode = MODES[(state.screen && state.screen !== 'playing' && state.freeMode) || state.mode] || MODES.easy;\n  const best = Math.max(0, Number((state.bestScores || {})[mode.id]) || 0);\n  return { challenge: false, decor: (state.decor || []).slice(), heading: `方寸九宫 · ${mode.title}`,\n    stat: best ? `最高 ${best} 分` : '来摆一局', detail: '落子成局 · 方寸之间',\n    title: best ? `我在${mode.title}最高拿到 ${best} 分，来庭院里摆一局？` : '方寸九宫 · 落子成局，来庭院里摆一局？' };\n}\n\nfunction shareContent(wx, card) {\n  const content = { title: card.title, ...(card.query ? { query: card.query } : {}) };\n  // 图片导出失败仍能邀请到同一题，微信使用当前画面作为转发图。\n  try { content.imageUrl = renderCard(wx, card); } catch (_) {}\n  return content;\n}\n\n// 右上角\"…\"菜单里的转发和分享到朋友圈。不调用 showShareMenu，微信会把这两项置灰。\nfunction enableMenuShare(wx, getState) {\n  try { if (wx.showShareMenu) wx.showShareMenu({ withShareTicket: true, menus: ['shareAppMessage', 'shareTimeline'] }); }\n  catch (_) { /* 旧客户端不支持朋友圈时，至少保留转发。 */ }\n  const currentCard = () => {\n    const state = getState(), card = helpCard(state) || resultCard(state) || menuCard(state);\n    return card;\n  };\n  if (wx.onShareAppMessage) wx.onShareAppMessage(() => shareContent(wx, currentCard()));\n  // 朋友圈用小游戏头像做封面，只需要标题。\n  if (wx.onShareTimeline) wx.onShareTimeline(() => {\n    const card = currentCard(); return { title: card.title, ...(card.query ? { query: card.query } : {}) };\n  });\n}\n\nmodule.exports = { resultCard, helpCard, drawCard, share, menuCard, enableMenuShare, parseInvitation, benchmarkText, comparison };\n","./js/progression/appearance":"const storage = require('../persistence/storage');\n\nconst KEY = 'fangcunAppearanceV1';\nconst SKINS = Object.freeze([\n  Object.freeze({ id: 'classic', name: '清雅原色', detail: '温润青绿 · 原有外观' }),\n  Object.freeze({ id: 'ink', name: '水墨黑白', detail: '素纸墨色 · 免费使用' }),\n  Object.freeze({ id: 'neon', name: '暗色霓虹', detail: '深蓝夜色 · 青玉微光' })\n]);\n\nfunction validId(id) { return SKINS.some(skin => skin.id === id); }\nfunction completedLevels(progress) {\n  return progress && Array.isArray(progress.stars)\n    ? progress.stars.filter(stars => Number.isInteger(stars) && stars >= 1 && stars \u003c= 3).length : 0;\n}\nfunction unlocked(id, preference) {\n  return validId(id) && (id !== 'neon' || Boolean(preference && preference.neonUnlocked));\n}\nfunction normalize(value, progress) {\n  const saved = value && value.version === 1 ? value : {};\n  const preference = { version: 1, selected: 'classic',\n    neonUnlocked: saved.neonUnlocked === true || completedLevels(progress) >= 3 };\n  if (unlocked(saved.selected, preference)) preference.selected = saved.selected;\n  return preference;\n}\nfunction load(api, progress) {\n  const saved = storage.read(api, KEY);\n  const preference = normalize(saved, progress);\n  // Old players receive the permanent unlock from existing progress, once.\n  if (preference.neonUnlocked && !(saved && saved.version === 1 && saved.neonUnlocked === true))\n    storage.write(api, KEY, preference);\n  return preference;\n}\nfunction unlockFromProgress(preference, progress) {\n  if (preference.neonUnlocked || completedLevels(progress) \u003c 3) return false;\n  preference.neonUnlocked = true;\n  return true;\n}\n\nmodule.exports = { KEY, SKINS, validId, completedLevels, unlocked, normalize, load, unlockFromProgress };\n","./js/progression/basics":"const { createBoard, canPlace, placeShape, findCompletedRegions, clearCompletedRegions, hasAnyPlacement } = require('../rules/board');\nconst { SHAPES } = require('../rules/shapes');\n\nconst KEY = 'fangcunBasicsStepV1';\nconst LESSONS = [\n  { title:'① 拖动方块，填满一行', detail:'把下方横条拖到虚线处，补齐这一行', move:{slot:1,c:6,r:4} },\n  { title:'② 这九格也是一个消除区域', detail:'补齐框出的 3×3 九宫，九格一起消除', move:{slot:1,c:3,r:5} },\n  { title:'③ 自己试试，完成一次消除', detail:'没有指定落点：选择一块，把行或九宫填满', move:null }\n];\n\nfunction isNew(state) {\n  return state.tutorialVisible && !state.collection.clears\n    && !state.challengeProgress.stars.some(Boolean) && !state.challengeProgress.active\n    && !Object.values(state.bestScores).some(Boolean) && !Object.keys(state.savedGames).length;\n}\nfunction create(step = 0) {\n  step=Number.isInteger(step) && step>=0 && step\u003cLESSONS.length?step:0;\n  const board=createBoard('easy');\n  if(step===1){for(let r=3;r\u003c5;r++)for(let c=3;c\u003c6;c++)board[r][c]=1;}\n  else for(const r of step===2?[1,7]:[4])for(let c=0;c\u003c6;c++)board[r][c]=1;\n  const shape=id=>SHAPES.find(p=>p.id===id);\n  const tray=step===2?[shape('line3H'),shape('line3H'),shape('line3H')]:[null,shape('line3H'),null];\n  return {step,board,tray,done:false,needsNext:false};\n}\nfunction play(lesson,slot,c,r) {\n  if(!lesson || lesson.done || lesson.needsNext)return null;\n  const piece=lesson.tray[slot],suggestion=LESSONS[lesson.step].move;\n  if(!piece || !canPlace(lesson.board,piece,c,r))return null;\n  if(suggestion && (slot!==suggestion.slot || c!==suggestion.c || r!==suggestion.r))return {guided:true};\n  placeShape(lesson.board,piece,c,r);lesson.tray[slot]=null;\n  const completed=findCompletedRegions(lesson.board);\n  const cleared=completed.rows.length+completed.cols.length+completed.palaces.length;\n  clearCompletedRegions(lesson.board,completed);\n  lesson.needsNext=cleared>0;lesson.done=cleared>0 && lesson.step===2;\n  const stuck=!cleared && lesson.tray.every(p=>!p || !hasAnyPlacement(lesson.board,p));\n  return {cleared,stuck};\n}\nmodule.exports={KEY,LESSONS,isNew,create,play};\n","./js/progression/collection":"// 庭院收藏：花木、陈设、纪念三条线并行。\n// 花木跟着庭院累计消除生长（每消除一行、一列或一宫记一次，每局都算，不只看最高分）；\n// 陈设用闯关星数添置。解锁的物件画进首页的月洞门插画里，不进棋盘。\nconst KEY = 'fangcunGardenCollectionV1';\nconst ITEMS = [\n  { id: 'bamboo', track: 'clears', need: 1, name: '修竹', note: '墙外添了一丛竹' },\n  { id: 'plum', track: 'clears', need: 20, name: '梅花', note: '院中老树开了花' },\n  { id: 'lotus', track: 'clears', need: 80, name: '荷花缸', note: '门内摆上一缸荷' },\n  { id: 'pine', track: 'clears', need: 200, name: '古松', note: '松枝探过了院墙' },\n  { id: 'lamp', track: 'stars', need: 12, name: '石灯', note: '山石旁立一盏灯' },\n  { id: 'lantern', track: 'stars', need: 36, name: '红灯笼', note: '月门挂起灯笼' },\n  { id: 'swallows', track: 'stars', need: 72, name: '双燕', note: '两只燕子飞进院来' },\n  { id: 'moon', track: 'stars', need: 108, name: '满月', note: '积满一百零八颗星' },\n  { id: 'arbour', track: 'memorial', need: 12, name: '花架', note: '藤花垂落，记下满庭花开', requirement: '第四章基础 12 关通关' },\n  { id: 'plaque', track: 'memorial', need: 48, name: '庭间匾额', note: '方寸之间，基础小径皆三星', requirement: '前四章基础 48 关全部三星' },\n  { id: 'chime', track: 'memorial', need: 7, name: '风铃', note: '七次重逢，檐下一声清响', requirement: '每日精选累计完成 7 天' },\n  { id: 'bridge', track: 'memorial', need: 21, name: '小桥', note: '二十一日相遇，院前添座小桥', requirement: '每日精选累计完成 21 天' },\n  { id: 'keyCharm', track: 'memorial', need: 12, name: '钥匙挂饰', note: '启扉寻幽，一把金钥留在庭间', requirement: '第五章基础 12 关通关' }\n];\nconst CHAPTER_ITEMS = ['arbour', 'plaque', 'keyCharm'];\nconst TRACKS = [\n  { id: 'clears', title: '花木', source: '庭院累计消除', unit: '次' },\n  { id: 'stars', title: '陈设', source: '闯关星数', unit: '颗星' },\n  { id: 'memorial', title: '纪念', source: '章节成就与每日精选', unit: '' }\n];\n\nfunction normalize(stored) {\n  const collection = { version: 1, clears: 0, seen: [], hidden: [] };\n  if (!stored || stored.version !== 1) return collection;\n  if (Number.isSafeInteger(stored.clears) && stored.clears >= 0) collection.clears = stored.clears;\n  if (Array.isArray(stored.seen)) collection.seen = ITEMS.map(item => item.id).filter(id => stored.seen.includes(id));\n  if (Array.isArray(stored.hidden)) collection.hidden = ITEMS.map(item => item.id).filter(id => stored.hidden.includes(id));\n  if (ITEMS.some(item => item.id === stored.target)) collection.target = stored.target;\n  if (Number.isSafeInteger(stored.dailyCompletions) && stored.dailyCompletions > 0) collection.dailyCompletions = stored.dailyCompletions;\n  if (Array.isArray(stored.achievements)) {\n    const earned = CHAPTER_ITEMS.filter(id => stored.achievements.includes(id));\n    if (earned.length) collection.achievements = earned;\n  }\n  if (stored.chapterCounts && typeof stored.chapterCounts === 'object') {\n    for (const id of CHAPTER_ITEMS) {\n      const n = stored.chapterCounts[id], need = ITEMS.find(item => item.id === id).need;\n      if (Number.isSafeInteger(n) && n >= 0 && n \u003c= need) {\n        if (!collection.chapterCounts) collection.chapterCounts = {};\n        collection.chapterCounts[id] = n;\n      }\n    }\n  }\n  return collection;\n}\n// 新成就只追加，不因更新后的计数、漏一天或旧章节存档缺失而收回纪念品。\nfunction syncProgress(collection, context = {}) {\n  let changed = false;\n  if (!context || typeof context !== 'object') return changed;\n  for (const [key, id] of [['chapterFourComplete', 'arbour'], ['allStars', 'plaque'], ['chapterFiveComplete', 'keyCharm']]) {\n    if (context[key] === true && !(collection.achievements || []).includes(id)) {\n      collection.achievements = (collection.achievements || []).concat(id); changed = true;\n    }\n  }\n  for (const id of CHAPTER_ITEMS) {\n    const n = context.chapterCounts && context.chapterCounts[id], need = ITEMS.find(item => item.id === id).need;\n    if (Number.isSafeInteger(n) && n >= 0 && n \u003c= need && n !== (collection.chapterCounts || {})[id]) {\n      collection.chapterCounts = { ...collection.chapterCounts, [id]: n }; changed = true;\n    }\n    if (n === need && !(collection.achievements || []).includes(id)) {\n      collection.achievements = (collection.achievements || []).concat(id); changed = true;\n    }\n  }\n  if (Number.isSafeInteger(context.dailyCompletions) && context.dailyCompletions > (collection.dailyCompletions || 0)) {\n    collection.dailyCompletions = context.dailyCompletions; changed = true;\n  }\n  return changed;\n}\nfunction totalStars(progress) { return progress.stars.reduce((sum, n) => sum + n, 0); }\nfunction amount(item, collection, stars) {\n  if (item.track === 'clears') return collection.clears;\n  if (item.track === 'stars') return stars;\n  return CHAPTER_ITEMS.includes(item.id)\n    ? ((collection.achievements || []).includes(item.id) ? item.need : (collection.chapterCounts || {})[item.id] || 0)\n    : collection.dailyCompletions || 0;\n}\nfunction requirement(item, collection, stars) {\n  const remaining = Math.max(0, item.need - amount(item, collection, stars));\n  if (!remaining) return '已解锁';\n  if (CHAPTER_ITEMS.includes(item.id)) return `${item.id === 'plaque' ? '前四章基础三星' : item.id === 'arbour' ? '第四章基础' : '第五章基础'} ${item.need - remaining}/${item.need} 关`;\n  if (item.track === 'memorial') return `每日精选再完成 ${remaining} 天`;\n  return `还差 ${remaining} ${item.track === 'clears' ? '次消除' : '颗星'}`;\n}\nfunction unlocked(collection, stars) {\n  return ITEMS.filter(item => amount(item, collection, stars) >= item.need).map(item => item.id);\n}\nfunction displayed(collection, stars) {\n  return unlocked(collection, stars).filter(id => !(collection.hidden || []).includes(id));\n}\nfunction fresh(collection, stars) {\n  return unlocked(collection, stars).filter(id => !collection.seen.includes(id));\n}\nfunction named(id) { return ITEMS.find(item => item.id === id).name; }\n// 某条线上下一件还没解锁的物件，以及还差多少；全部解锁时返回 null。\nfunction next(collection, stars, track) {\n  const item = ITEMS.find(entry => entry.track === track && amount(entry, collection, stars) \u003c entry.need);\n  return item ? { item, missing: item.need - amount(item, collection, stars) } : null;\n}\n// A completed target remains readable until the UI acknowledges the reward.\n// Missing targets in pre-feature saves behave exactly like an unselected target.\nfunction target(collection, stars) {\n  const item = ITEMS.find(entry => entry.id === collection.target);\n  if (!item) return null;\n  const missing = Math.max(0, item.need - amount(item, collection, stars));\n  return { item, missing, complete: missing === 0 };\n}\nfunction setTarget(collection, id, stars) {\n  if (id === null) {\n    if (!collection.target) return false;\n    collection.target = null;\n    return true;\n  }\n  const item = ITEMS.find(entry => entry.id === id);\n  if (!item || amount(item, collection, stars) >= item.need) return false;\n  collection.target = collection.target === id ? null : id;\n  return true;\n}\n// 结算页、首页共用：优先自选目标；未选择时沿用新物件和下一件进度。\nfunction progressLine(collection, stars, track) {\n  const selected = target(collection, stars);\n  if (selected) return selected.complete ? `目标达成 · 已获得「${selected.item.name}」`\n    : `目标「${selected.item.name}」· ${requirement(selected.item, collection, stars)}`;\n  const unseen = fresh(collection, stars).filter(id => ITEMS.find(item => item.id === id).track === track);\n  if (unseen.length) return `庭院新添「${named(unseen[0])}」${unseen.length>1?`等 ${unseen.length} 件 `:''}· 回首页看看`;\n  const upcoming = next(collection, stars, track);\n  if (!upcoming) return track === 'clears' ? '庭院花木已齐 · 不限时，也不必赶进度' : track === 'stars' ? '庭院陈设已齐' : '庭间纪念已齐';\n  return track === 'clears' ? `再消除 ${upcoming.missing} 次，庭院将添「${upcoming.item.name}」`\n    : track === 'stars' ? `再得 ${upcoming.missing} 颗星，庭院将添「${upcoming.item.name}」`\n    : `${requirement(upcoming.item, collection, stars)}，庭院将添「${upcoming.item.name}」`;\n}\n\nfunction focus(collection, stars, track) {\n  const chosen = target(collection, stars);\n  const dailyItem = track === 'memorial' && ITEMS.find(item => item.track === track\n    && !CHAPTER_ITEMS.includes(item.id) && amount(item, collection, stars) \u003c item.need);\n  const upcoming = chosen || (track === 'memorial' ? dailyItem && {item:dailyItem} : next(collection, stars, track));\n  if (!upcoming) return null;\n  const item = upcoming.item, have = Math.min(item.need, amount(item, collection, stars));\n  const unit = item.track === 'clears' ? '次消除' : item.track === 'stars' ? '颗星'\n    : CHAPTER_ITEMS.includes(item.id) ? '关' : '天';\n  return { item, have, progress: `${have}/${item.need} ${unit}`, complete: have >= item.need, text: `${have >= item.need ? '已添' : '想添'}「${item.name}」· ${have}/${item.need} ${unit}` };\n}\n\n// Growth is a view of existing progress, never a second reward balance.\nfunction growth(collection, stars, track='clears') {\n  const focusItem=focus(collection,stars,track);\n  if(!focusItem)return null;\n  const {item,have,complete}=focusItem;\n  const ratio=Math.max(0,Math.min(1,have/item.need));\n  const stage=complete?2:ratio>=.5?1:0;\n  return {...focusItem,ratio,stage,label:['初见雏形','渐渐成形','已成庭景'][stage]};\n}\nfunction growthResult(collection, stars, sessionClears) {\n  if(!Number.isSafeInteger(sessionClears) || sessionClears\u003c=0)return null;\n  const before={...collection,clears:Math.max(0,collection.clears-sessionClears)};\n  const previous=growth(before,stars);\n  if(!previous || previous.item.track!=='clears' || previous.complete)return null;\n  const current=growth({...collection,target:previous.item.id},stars);\n  return { ...current, before:previous.have,\n    text:`${current.item.name} ${previous.have} → ${current.have}/${current.item.need} · ${current.label}` };\n}\n\nfunction focusForState(state) {\n  if (!state.collection || !state.challengeProgress) return null;\n  const run = state.screen === 'playing' ? state.challenge : null;\n  return focus(state.collection,totalStars(state.challengeProgress),\n    run && run.dailyDate ? 'memorial' : run || state.homeMode==='challenge' ? 'stars' : 'clears');\n}\n\nfunction growthForState(state) {\n  return growth(state.collection,totalStars(state.challengeProgress));\n}\n\nmodule.exports = { focusForState, growthForState, KEY, ITEMS, TRACKS, normalize, syncProgress, totalStars, amount, requirement, unlocked, displayed, fresh, named, next, t 能落子或被消除。\nfunction createBoard(modeId) {\n  const mode = MODES[modeId];\n  const board = Array.from({ length: mode.rows }, () => Array(mode.cols).fill(0));\n  mode.blocked.forEach(([row, col]) => { board[row][col] = 2; });\n  (mode.missing || []).forEach(([row, col]) => { board[row][col] = -1; });\n  return board;\n}\n\n// Shared by target selection and save validation; maps may have fewer than three full palaces.\nfunction energyPalacePool(modeId) {\n  const board = createBoard(modeId), cols = board[0].length / 3, pool = [];\n  for (let r = 0; r \u003c Math.floor(board.length / 3); r++) {\n    for (let c = 0; c \u003c Math.floor(cols); c++) {\n      let valid = true;\n      for (let y = 0; y \u003c 3; y++) for (let x = 0; x \u003c 3; x++) {\n        if (board[r * 3 + y][c * 3 + x] !== 0) valid = false;\n      }\n      if (valid) pool.push(r * cols + c);\n    }\n  }\n  return pool;\n}\n\nfunction canPlace(board, shape, originCol, originRow) {\n  return shape.cells.every(([dx, dy]) => {\n    const col = originCol + dx;\n    const row = originRow + dy;\n    return row >= 0 && row \u003c board.length\n      && col >= 0 && col \u003c board[row].length\n      && board[row][col] === 0;\n  });\n}\n\nfunction placeShape(board, shape, originCol, originRow) {\n  shape.cells.forEach(([dx, dy]) => {\n    board[originRow + dy][originCol + dx] = 1;\n  });\n}\n\nfunction findCompletedRegions(board) {\n  const rows = [];\n  const cols = [];\n  const palaces = [];\n\n  for (let row = 0; row \u003c board.length; row += 1) {\n    // 至少含一个真实方块：全是留白 / 禁区的行不能凭空\"填满\"。\n    if (board[row].some(cell => cell === 1) && board[row].every(cell => cell !== 0)) rows.push(row);\n  }\n\n  for (let col = 0; col \u003c board[0].length; col += 1) {\n    let full = true;\n    let occupied = false;\n    for (let row = 0; row \u003c board.length; row += 1) {\n      if (board[row][col] === 0) full = false;\n      if (board[row][col] === 1) occupied = true;\n    }\n    if (full && occupied) cols.push(col);\n  }\n\n  for (let palaceRow = 0; palaceRow \u003c Math.floor(board.length / 3); palaceRow += 1) {\n    for (let palaceCol = 0; palaceCol \u003c Math.floor(board[0].length / 3); palaceCol += 1) {\n      let full = true;\n      for (let dy = 0; dy \u003c 3; dy += 1) {\n        for (let dx = 0; dx \u003c 3; dx += 1) {\n          if (board[palaceRow * 3 + dy][palaceCol * 3 + dx] !== 1) full = false;\n        }\n      }\n      if (full) palaces.push([palaceCol, palaceRow]);\n    }\n  }\n\n  return { rows, cols, palaces };\n}\n\nfunction clearCompletedRegions(board, completed) {\n  completed.rows.forEach(row => {\n    for (let col = 0; col \u003c board[row].length; col += 1) {\n      if (board[row][col] === 1) board[row][col] = 0;\n    }\n  });\n  completed.cols.forEach(col => {\n    for (let row = 0; row \u003c board.length; row += 1) {\n      if (board[row][col] === 1) board[row][col] = 0;\n    }\n  });\n  completed.palaces.forEach(([palaceCol, palaceRow]) => {\n    for (let dy = 0; dy \u003c 3; dy += 1) {\n      for (let dx = 0; dx \u003c 3; dx += 1) {\n        const row = palaceRow * 3 + dy;\n        const col = palaceCol * 3 + dx;\n        if (board[row][col] === 1) board[row][col] = 0;\n      }\n    }\n  });\n}\n\nfunction hasAnyPlacement(board, shape) {\n  for (let row = 0; row \u003c board.length; row += 1) {\n    for (let col = 0; col \u003c board[row].length; col += 1) {\n      if (canPlace(board, shape, col, row)) return true;\n    }\n  }\n  return false;\n}\n\nmodule.exports = {\n  createBoard,\n  energyPalacePool,\n  canPlace,\n  placeShape,\n  findCompletedRegions,\n  clearCompletedRegions,\n  hasAnyPlacement\n};\n","./js/rules/garden-rules":"const { energyPalacePool } = require('./board');\n\n// Calculations only: callers own the state, random sequence and save timing.\nfunction createEnergyPalaces(mode, random = Math.random) {\n  const pool = energyPalacePool(mode);\n  if (!pool.length) return [];\n  for (let i = pool.length - 1; i > 0; i -= 1) {\n    const j = Math.floor(random() * (i + 1));\n    const temp = pool[i];\n    pool[i] = pool[j];\n    pool[j] = temp;\n  }\n  return pool.slice(0, Math.min(3, pool.length));\n}\n\nfunction completedCells(board, completed) {\n  const seen = [];\n  const cells = [];\n  function addCell(col, row) {\n    const key = row * board[0].length + col;\n    if (seen[key] || board[row][col] === 2 || board[row][col] === -1) return;\n    seen[key] = true;\n    cells.push([col, row]);\n  }\n  completed.rows.forEach(row => {\n    for (let col = 0; col \u003c board[row].length; col += 1) addCell(col, row);\n  });\n  completed.cols.forEach(col => {\n    for (let row = 0; row \u003c board.length; row += 1) addCell(col, row);\n  });\n  completed.palaces.forEach(([palaceCol, palaceRow]) => {\n    for (let dy = 0; dy \u003c 3; dy += 1) {\n      for (let dx = 0; dx \u003c 3; dx += 1) {\n        addCell(palaceCol * 3 + dx, palaceRow * 3 + dy);\n      }\n    }\n  });\n  return cells;\n}\n\nfunction boardOccupancy(board) {\n  let filled = 0;\n  let total = 0;\n  board.forEach(row => row.forEach(value => {\n    if (value === -1) return;\n    total += 1;\n    if (value !== 0) filled += 1;\n  }));\n  return total ? filled / total : 0;\n}\n\nfunction simultaneousClearScore(regionCount) {\n  if (regionCount \u003c= 0) return 0;\n  if (regionCount === 1) return 10;\n  if (regionCount === 2) return 40;\n  if (regionCount === 3) return 80;\n  return 80 + (regionCount - 3) * 35;\n}\n\nmodule.exports = { createEnergyPalaces, completedCells, boardOccupancy, simultaneousClearScore };\n","./js/rules/level-data":"// Decode reviewed board data once at module load, never during rendering.\nfunction decode(definition) {\n  const {board,...level}=definition,filled=[],blocked=[];\n  if(!Array.isArray(board)||board.length!==9||board.some(row=>typeof row!=='string'||!/^[012]{9}$/.test(row))) {\n    throw new Error(`Invalid authored board: ${level.title}`);\n  }\n  board.forEach((row,r)=>[...row].forEach((cell,c)=>{\n    if(cell==='1')filled.push([c,r]);\n    if(cell==='2')blocked.push([c,r]);\n  }));\n  return {...level,filled,blocked,holes:[]};\n}\nmodule.exports={decode};\n","./js/rules/shapes":"// 第一批只使用容易识别、无需旋转的基础图形。\nconst SHAPES = [\n  { id: 'dot', cells: [[0, 0]], weight: 10 },\n  { id: 'line2H', cells: [[0, 0], [1, 0]], weight: 10 },\n  { id: 'line2V', cells: [[0, 0], [0, 1]], weight: 10 },\n  { id: 'line3H', cells: [[0, 0], [1, 0], [2, 0]], weight: 9 },\n  { id: 'line3V', cells: [[0, 0], [0, 1], [0, 2]], weight: 9 },\n  { id: 'square2', cells: [[0, 0], [1, 0], [0, 1], [1, 1]], weight: 8 },\n  { id: 'corner3A', cells: [[0, 0], [0, 1], [1, 1]], weight: 8 },\n  { id: 'corner3B', cells: [[0, 0], [1, 0], [0, 1]], weight: 8 },\n  { id: 'corner3C', cells: [[0, 0], [1, 0], [1, 1]], weight: 8 },\n  { id: 'corner3D', cells: [[1, 0], [0, 1], [1, 1]], weight: 8 },\n  { id: 'line4H', cells: [[0, 0], [1, 0], [2, 0], [3, 0]], weight: 5 },\n  { id: 'line4V', cells: [[0, 0], [0, 1], [0, 2], [0, 3]], weight: 5 },\n  // T 形补齐四个朝向。方向变化比单纯增大面积更考验空间观察，\n  // 同时每块只有 4 格，不会像完整 3×3 那样在中后期频繁成为死牌。\n  { id: 'tee4Down', cells: [[0, 0], [1, 0], [2, 0], [1, 1]], weight: 2 },\n  { id: 'tee4Up', cells: [[1, 0], [0, 1], [1, 1], [2, 1]], weight: 2 },\n  { id: 'tee4Right', cells: [[0, 0], [0, 1], [1, 1], [0, 2]], weight: 2 },\n  { id: 'tee4Left', cells: [[1, 0], [0, 1], [1, 1], [1, 2]], weight: 2 },\n  // S/Z 折线加入镜像与纵向版本，轮廓有变化但仍保持易读。\n  { id: 'zig4H', cells: [[0, 0], [1, 0], [1, 1], [2, 1]], weight: 2 },\n  { id: 'zag4H', cells: [[1, 0], [2, 0], [0, 1], [1, 1]], weight: 2 },\n  { id: 'zig4V', cells: [[1, 0], [0, 1], [1, 1], [0, 2]], weight: 2 },\n  { id: 'zag4V', cells: [[0, 0], [0, 1], [1, 1], [1, 2]], weight: 2 },\n  { id: 'line5H', cells: [[0, 0], [1, 0], [2, 0], [3, 0], [4, 0]], weight: 3 },\n  { id: 'line5V', cells: [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]], weight: 3 },\n  { id: 'corner5A', cells: [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2]], weight: 3 },\n  { id: 'corner5B', cells: [[0, 0], [1, 0], [2, 0], [0, 1], [0, 2]], weight: 3 },\n  { id: 'corner5C', cells: [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]], weight: 3 },\n  { id: 'corner5D', cells: [[2, 0], [2, 1], [0, 2], [1, 2], [2, 2]], weight: 3 },\n  { id: 'plus5', cells: [[1, 0], [0, 1], [1, 1], [2, 1], [1, 2]], weight: 2 },\n  { id: 'rect6H', cells: [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1]], weight: 2 },\n  { id: 'rect6V', cells: [[0, 0], [1, 0], [0, 1], [1, 1], [0, 2], [1, 2]], weight: 2 }\n];\n\nfunction adjustedWeight(shape, occupancy, recentIds) {\n  let weight = shape.weight;\n  const size = shape.cells.length;\n\n  if (occupancy \u003c 0.25) {\n    if (size === 1) weight *= 0.45;\n    if (size >= 4) weight *= 1.3;\n  } else if (occupancy > 0.68) {\n    if (size \u003c= 3) weight *= 1.65;\n    if (size >= 6) weight *= 0.38;\n  } else if (occupancy > 0.5) {\n    if (size \u003c= 3) weight *= 1.2;\n    if (size >= 6) weight *= 0.72;\n  }\n\n  if (recentIds.indexOf(shape.id) >= 0) weight *= 0.35;\n  return weight;\n}\n\nfunction randomShape(options) {\n  const occupancy = options.occupancy || 0;\n  const recentIds = options.recentIds || [];\n  const candidates = options.candidates || SHAPES;\n  const weighted = candidates.map(shape => ({\n    shape,\n    weight: adjustedWeight(shape, occupancy, recentIds)\n  }));\n  const total = weighted.reduce((sum, item) => sum + item.weight, 0);\n  let roll = (options.random || Math.random)() * total;\n\n  for (let i = 0; i \u003c weighted.length; i += 1) {\n    roll -= weighted[i].weight;\n    if (roll \u003c= 0) return weighted[i].shape;\n  }\n\n  return weighted[0].shape;\n}\n\nfunction randomLuckyShape(random) {\n  const lucky = SHAPES.filter(shape => shape.cells.length \u003c= 2);\n  return lucky[Math.floor(random() * lucky.length)];\n}\n\nfunction createTray(options) {\n  const normalized = typeof options === 'boolean' ? { includeLucky: options } : (options || {});\n  const random = normalized.random || Math.random;\n  const occupancy = normalized.occupancy || 0;\n  const recentIds = (normalized.recentIds || []).slice(-6);\n  const tray = [];\n\n  for (let index = 0; index \u003c 3; index += 1) {\n    const localRecent = recentIds.concat(tray.map(shape => shape.id));\n    tray.push(randomShape({ occupancy, recentIds: localRecent, random }));\n  }\n\n  let luckySlot = -1;\n  if (normalized.includeLucky) {\n    luckySlot = Math.floor(random() * tray.length);\n    tray[luckySlot] = { ...randomLuckyShape(random), lucky: true };\n  }\n\n  if (normalized.canUseShape && !tray.some(normalized.canUseShape)) {\n    const usableShapes = SHAPES.filter(normalized.canUseShape);\n    if (usableShapes.length > 0) {\n      const replaceableSlots = [0, 1, 2].filter(index => index !== luckySlot);\n      const slot = replaceableSlots[Math.floor(random() * replaceableSlots.length)];\n      tray[slot] = randomShape({ occupancy, recentIds, candidates: usableShapes, random });\n      if (normalized.onSafetyUsed) normalized.onSafetyUsed();\n    }\n  }\n  return tray;\n}\n\nmodule.exports = { SHAPES, createTray };\n","./js/rules/tools":"const { canPlace, placeShape, findCompletedRegions } = require('./board');\nconst challenges = require('../challenge/challenges');\n\n// A hint is sold only when a complete winning continuation has been replayed.\n// ponytail: bounded search may decline a solvable board; never substitute a greedy guess.\nlet cachedLevel = -1;\nconst continuations = new Map();\nconst copyRun = run => JSON.parse(JSON.stringify(run));\nconst positionKey = run => JSON.stringify([run.board,run.ice,run.stones,run.flowers,run.keys,run.gates,run.tray.map(p=>p&&p.id),run.cursor,run.progress,run.history.length]);\nfunction winningPath(source, { maxNodes = 20000, maxMs = 60 } = {}) {\n  if (!source || source.ended) return null;\n  if (cachedLevel !== source.level) { cachedLevel=source.level; continuations.clear(); }\n  const key=positionKey(source);\n  if (continuations.has(key)) return continuations.get(key).map(m=>m.slice());\n  const deadline=Date.now()+maxMs, reference=challenges.level(source.level).solution;\n  let nodes=0;\n  const expired=()=>nodes>=maxNodes || Date.now()>=deadline;\n  const advance=(run,move)=>{\n    if(expired())return null;\n    nodes++;\n    const next=copyRun(run);\n    return challenges.play(next,...move)?next:null;\n  };\n  const visited=new Set();\n  function search(run) {\n    if(run.won)return [];\n    if(run.ended || expired())return null;\n    const key=positionKey(run);\n    if(visited.has(key))return null;\n    visited.add(key);\n    // Off-path boards often still admit an authored suffix. Replay it, don't assume it.\n    const remaining=reference.slice();\n    for(const move of run.history){\n      const used=remaining.findIndex(m=>m.every((v,i)=>v===move[i]));\n      if(used>=0)remaining.splice(used,1);\n    }\n    const candidates=continuations.has(key)?[continuations.get(key)]:[remaining,...reference.map((_,i)=>reference.slice(i))];\n    for(const plan of candidates){\n      let test=run;const path=[];\n      for(const move of plan){\n        test=advance(test,move);\n        if(!test)break;\n        path.push(move);\n        if(test.won)return path;\n        if(test.ended)break;\n      }\n      if(expired())return null;\n    }\n    const options=[];\n    for(let slot=0;slot\u003c3;slot++){\n      const piece=run.tray[slot];if(!piece)continue;\n      for(let r=0;r\u003c9;r++)for(let c=0;c\u003c9;c++){\n        if(expired())return null;\n        if(!canPlace(run.board,piece,c,r))continue;\n        const move=[slot,c,r],next=advance(run,move);\n        if(!next)continue;\n        if(next.won)return [move];\n        if(!next.ended)options.push({move,next,value:(next.progress-run.progress)*100+(run.ice.length-next.ice.length)*4\n          +(run.flowers || []).reduce((sum,p,i)=>sum+p[2]-next.flowers[i][2],0)*20\n          +(run.keys.length-next.keys.length)*40});\n      }\n    }\n    options.sort((a,b)=>b.value-a.value);\n    for(const {move,next} of options){const tail=search(next);if(tail)return [move,...tail];if(expired())return null;}\n    return null;\n  }\n  const path=search(source);\n  if(!path)return null;\n  let run=copyRun(source);\n  if(continuations.size>128)continuations.clear();\n  for(let i=0;i\u003cpath.length;i++){\n    continuations.set(positionKey(run),path.slice(i).map(m=>m.slice()));\n    challenges.play(run,...path[i]);\n  }\n  return path.map(m=>m.slice());\n}\n// No verified continuation from here: step back to the nearest position that still wins.\n// An authored prefix always wins, so once the search budget is spent we fall back to it.\nfunction recovery(run, maxMs = 120) {\n  const level=challenges.level(run.level), deadline=Date.now()+maxMs;\n  for(let undo=1;undo\u003c=run.history.length;undo++){\n    const history=run.history.slice(0,run.history.length-undo);\n    const authored=history.every((move,i)=>move.every((v,j)=>v===level.solution[i][j]));\n    if(!authored && Date.now()>=deadline)continue;\n    const earlier=challenges.restore({level:run.level,rule:level.rule,history,failedOnce:run.failedOnce});\n    const path=earlier && winningPath(earlier,authored?{maxNodes:Infinity,maxMs:1000}:{maxNodes:3000,maxMs:15});\n    if(path)return {undo,run:earlier,path};\n  }\n  return null;\n}\nfunction suggest(state) {\n  if (state.gameOver || (state.challenge && state.challenge.ended)) return null;\n  if (state.challenge) {\n    const path=winningPath(state.challenge);\n    if (path) return {slot:path[0][0],c:path[0][1],r:path[0][2]};\n    const back=recovery(state.challenge);\n    return back && {slot:back.path[0][0],c:back.path[0][1],r:back.path[0][2],undo:back.undo,run:back.run};\n  }\n  let best = null, value = -Infinity;\n  state.tray.forEach((piece,slot)=>{\n    if (!piece) return;\n    for(let r=0;r\u003cstate.board.length;r++) for(let c=0;c\u003cstate.board[0].length;c++) {\n      if(!canPlace(state.board,piece,c,r))continue;\n      const board=state.board.map(row=>row.slice());placeShape(board,piece,c,r);\n      const done=findCompletedRegions(board);\n      let score=(done.rows.length+done.cols.length+done.palaces.length)*100;\n      for(const index of state.energyPalaces) {\n        const x=index%(board[0].length/3)*3,y=Math.floor(index/(board[0].length/3))*3;\n        let filled=0;for(let a=0;a\u003c3;a++)for(let b=0;b\u003c3;b++)filled+=board[y+a][x+b]===1?1:0;\n        score+=filled*filled;\n      }\n      if(score>value){value=score;best={slot,c,r};}\n    }\n  });\n  return best;\n}\n\n// Remove the fewest ordinary cells needed for one current piece to fit.\n// Permanent obstacles and missing corners are never touched; no score is earned.\nfunction revivalCells(state) {\n  let best=null;\n  for(const piece of state.tray) {\n    if(!piece)continue;\n    for(let r=0;r\u003cstate.board.length;r++)for(let c=0;c\u003cstate.board[0].length;c++) {\n      const cells=piece.cells.map(([x,y])=>[c+x,r+y]);\n      if(cells.some(([x,y])=>!state.board[y] || ![0,1].includes(state.board[y][x])))continue;\n      const occupied=cells.filter(([x,y])=>state.board[y][x]===1);\n      if(occupied.length && (!best || occupied.length\u003cbest.length))best=occupied;\n    }\n  }\n  return best;\n}\nmodule.exports={suggest,revivalCells,winningPath};\n","./js/rules/undo-budget":"// Attempt-wide budget: board rollback must never refund a spent opportunity.\nconst MAX_GRANTS = 2;\nlet sequence = 0;\nfunction create() {\n  return { version: 1, attemptId: `${Date.now().toString(36)}-${(++sequence).toString(36)}-${Math.random().toString(36).slice(2,10)}`, spent: 0, grants: 0 };\n}\nfunction valid(value) {\n  return Boolean(value && value.version === 1 && typeof value.attemptId === 'string'\n    && /^[a-z0-9-]{1,80}$/.test(value.attemptId)\n    && Number.isInteger(value.grants) && value.grants >= 0 && value.grants \u003c= MAX_GRANTS\n    && Number.isInteger(value.spent) && value.spent >= 0 && value.spent \u003c= 1 + value.grants);\n}\nfunction normalize(value) {\n  if (value === undefined) return create(); // Legacy save, persisted at its next checkpoint.\n  if (valid(value)) {\n    return { version: 1, attemptId: value.attemptId, spent: value.spent, grants: value.grants };\n  }\n  // Damaged metadata must not erase a valid board or grant extra opportunities.\n  return { ...create(), spent: 3, grants: MAX_GRANTS };\n}\nfunction remaining(budget) { return budget === undefined ? 1 : valid(budget) ? 1 + budget.grants - budget.spent : 0; }\nfunction current(state) { return state.challenge ? state.challenge.undoBudget : state.undoBudget; }\nfunction hasHistory(state) {\n  return state.screen === 'playing' && !state.gardenIntro && (state.challenge\n    ? !state.challenge.won && state.challenge.history.length > 0\n    : !state.gameOver && Boolean(state.gardenUndo));\n}\nfunction canSupplement(state) {\n  const budget = current(state);\n  return Boolean(hasHistory(state) && state.videoToolsEnabled && !(state.challenge && state.challenge.dailyDate)\n    && budget && remaining(budget) === 0 && budget.grants \u003c MAX_GRANTS);\n}\nfunction spend(budget) { return valid(budget) && remaining(budget) > 0 ? { ...budget, spent: budget.spent + 1 } : null; }\nfunction grant(budget) {\n  return valid(budget) && remaining(budget) === 0 && budget.grants \u003c MAX_GRANTS ? { ...budget, grants: budget.grants + 1 } : null;\n}\nmodule.exports = { MAX_GRANTS, create, normalize, remaining, current, hasHistory, canSupplement, spend, grant };\n","./js/views/appearance-view":"const { COLORS } = require('../config');\nconst appearance = require('../progression/appearance');\nconst themes = require('./themes');\nconst { roundedRect, text, button, pressedRect } = require('./canvas-ui');\n\nfunction getAppearanceActions(layout) {\n  const width = Math.min(342, layout.width - 32);\n  const height = Math.min(504, layout.height - layout.safeTop - layout.safeBottom - 16);\n  const x = (layout.width - width) / 2;\n  const y = layout.safeTop + (layout.height - layout.safeTop - layo ','700');\n}\n\nmodule.exports = { drawTarget, drawFlower, drawKey, drawGate };\n","./js/views/board-view":"const { COLORS, MODES } = require('../config');\nconst challenges = require('../challenge/challenges');\nconst mechanicGuide = require('../progression/mechanic-guide');\nconst dragPlacement = require('./drag-placement');\nconst { roundedRect, text } = require('./canvas-ui');\nconst { drawTarget, drawFlower, drawKey, drawGate } = require('./board-symbols');\n\nfunction nearbyEnergy(state) {\n  if (state.challenge || state.gardenIntro || state.gameOver || !state.board) return null;\n  const cols=state.board[0].length/3;\n  let best=null;\n  for (const index of state.energyPalaces || []) {\n    const c=index%cols*3,r=Math.floor(index/cols)*3;\n    let missing=0;\n    for(let y=0;y\u003c3;y++)for(let x=0;x\u003c3;x++)if(state.board[r+y][c+x]===0)missing++;\n    if(missing>0 && missing\u003c=3 && (!best || missing\u003cbest.missing))best={c,r,missing};\n  }\n  return best;\n}\n\nfunction drawBoard(ctx, layout, state) {\n  const { boardX, boardY, boardWidth, boardHeight, cellSize } = layout;\n  const rows = state.board.length;\n  const cols = state.board[0].length;\n  const palaceCols = cols / 3;\n  const energyPalaces = state.energyPalaces || [];\n  const clearingCells = state.clearingCells || [];\n  // 数组索引查表代替 `${col},${row}` 字符串键：每帧少建 81 个字符串和一个对象。\n  const clearing = [];\n  for (let i = 0; i \u003c clearingCells.length; i += 1) {\n    clearing[clearingCells[i][1] * cols + clearingCells[i][0]] = true;\n  }\n  const isEnergyPalace = [];\n  for (let i = 0; i \u003c energyPalaces.length; i += 1) isEnergyPalace[energyPalaces[i]] = true;\n\n  ctx.fillStyle = COLORS.panel;\n  ctx.strokeStyle = COLORS.boardEdge;\n  ctx.lineWidth = 1;\n  if (MODES[state.mode].missing) {\n    // 四角缺格的庭院沿轮廓外扩 7px，与普通底板共用 12px 圆角。\n    // 缺角大小从棋盘第一行开头的留白数推出，改地图时轮廓自动跟随。\n    let corner = 0;\n    while (corner \u003c cols && state.board[0][corner] === -1) corner += 1;\n    const x = [boardX - 7, boardX + cellSize * corner - 7,\n      boardX + cellSize * (cols - corner) + 7, boardX + boardWidth + 7];\n    const y = [boardY - 7, boardY + cellSize * corner - 7,\n      boardY + cellSize * (rows - corner) + 7, boardY + boardHeight + 7];\n    const corners = [[1, 0], [2, 0], [2, 1], [3, 1], [3, 2], [2, 2],\n      [2, 3], [1, 3], [1, 2], [0, 2], [0, 1], [1, 1]];\n    ctx.beginPath();\n    ctx.moveTo(x[1], (y[0] + y[1]) / 2);\n    corners.forEach(([col, row], index) => {\n      const [nextCol, nextRow] = corners[(index + 1) % corners.length];\n      ctx.arcTo(x[col], y[row], x[nextCol], y[nextRow], 12);\n    });\n    ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n  } else {\n    roundedRect(ctx, boardX - 7, boardY - 7, boardWidth + 14, boardHeight + 14, 12);\n    ctx.fill();\n    ctx.stroke();\n  }\n\n  const gap = 2.5;\n  const size = cellSize - gap * 2;\n  const radius = Math.max(3, cellSize * 0.12);\n\n  for (let row = 0; row \u003c rows; row += 1) {\n    const palaceRowBase = Math.floor(row / 3) * palaceCols;\n    for (let col = 0; col \u003c cols; col += 1) {\n      const x = boardX + col * cellSize + gap;\n      const y = boardY + row * cellSize + gap;\n      const cellValue = state.board[row][col];\n      if (cellValue === -1) continue;\n      const emptyColor = isEnergyPalace[palaceRowBase + Math.floor(col / 3)]\n        ? COLORS.energyEmptyCell\n        : COLORS.emptyCell;\n      // 石台整块画在下面；棋子要落在一个空格底上，所以棋子格照常铺空格色。\n      if (cellValue === 2 && !state.challenge && MODES[state.mode].blockedStyle !== 'stone') continue;\n      ctx.fillStyle = clearing[row * cols + col] || cellValue === 2 ? COLORS.emptyCell\n        : (cellValue === 1 ? COLORS.block : emptyColor);\n      roundedRect(ctx, x, y, size, size, radius);\n      ctx.fill();\n    }\n  }\n  drawBlocked(ctx, layout, state);\n  if (state.challenge) {\n    (state.challenge.flowers || []).forEach(([c,r,remaining])=>drawFlower(ctx,boardX+c*cellSize+3,boardY+r*cellSize+3,cellSize-6,remaining));\n    const area=challenges.level(state.challenge.level).area || [];\n    if(area.length){\n      ctx.save();ctx.strokeStyle=COLORS.accent;ctx.lineWidth=1.5;ctx.setLineDash([3,2]);\n      area.forEach(([c,r])=>{roundedRect(ctx,boardX+c*cellSize+2,boardY+r*cellSize+2,cellSize-4,cellSize-4,3);ctx.stroke();});\n      ctx.restore();\n    }\n    state.challenge.stones.forEach(([c,r])=>{\n      const x=boardX+c*cellSize+4,y=boardY+r*cellSize+4,size=cellSize-8;\n      drawTarget(ctx,x,y,size);\n    });\n    state.challenge.ice.forEach(([c,r])=>{\n      const x=boardX+c*cellSize+3,y=boardY+r*cellSize+3,size=cellSize-6;\n      ctx.fillStyle='rgba(208,242,250,.7)';roundedRect(ctx,x,y,size,size,4);ctx.fill();\n      ctx.strokeStyle='#326D91';ctx.lineWidth=1.3;roundedRect(ctx,x,y,size,size,4);ctx.stroke();\n      // A snow crystal and border distinguish ice from ordinary blocks without color alone.\n      ctx.beginPath();ctx.moveTo(x+size*.2,y+size*.5);ctx.lineTo(x+size*.8,y+size*.5);\n      ctx.moveTo(x+size*.5,y+size*.2);ctx.lineTo(x+size*.5,y+size*.8);\n      ctx.moveTo(x+size*.3,y+size*.3);ctx.lineTo(x+size*.7,y+size*.7);ctx.stroke();\n      if (state.challenge.stones.some(([sx,sy])=>sx===c&&sy===r)) {\n        const radius=Math.max(5,cellSize*.21);\n        ctx.fillStyle='#F8FCFF';ctx.beginPath();ctx.arc(x+size/2,y+size/2,radius,0,Math.PI*2);ctx.fill();\n        text(ctx,'2',x+size/2,y+size/2+radius*.65,Math.max(10,cellSize*.33),'#263E6A','center','700');\n      }\n    });\n    for(const gate of state.challenge.gates || [])for(const [c,r] of gate.cells)\n      drawGate(ctx,boardX+c*cellSize+3,boardY+r*cellSize+3,cellSize-6,gate.id);\n    for(const [c,r,id] of state.challenge.keys || [])\n      drawKey(ctx,boardX+c*cellSize+3,boardY+r*cellSize+3,cellSize-6,id,state.challenge.ice.some(p=>p[0]===c&&p[1]===r));\n    if (state.challenge.level>=0 && state.challenge.level\u003c3 && !state.piecesPlaced && !state.drag) {\n      ctx.strokeStyle=COLORS.accent;ctx.lineWidth=1.5;\n      if(ctx.setLineDash)ctx.setLineDash([3,3]);\n      challenges.level(state.challenge.level).holes.forEach(([c,r])=>{\n        roundedRect(ctx,boardX+c*cellSize+3,boardY+r*cellSize+3,cellSize-6,cellSize-6,3);ctx.stroke();\n      });\n      if(ctx.setLineDash)ctx.setLineDash([]);\n    }\n  }\n\n  ctx.strokeStyle = COLORS.palaceLine;\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  for (let row = 0; row \u003c rows; row += 1) {\n    for (let col = 0; col \u003c cols; col += 1) {\n      if (state.board[row][col] === -1) continue;\n      const x = boardX + col * cellSize;\n      const y = boardY + row * cellSize;\n      if (col > 0 && col % 3 === 0 && state.board[row][col - 1] !== -1) {\n        ctx.moveTo(x, y); ctx.lineTo(x, y + cellSize);\n      }\n      if (row > 0 && row % 3 === 0 && state.board[row - 1][col] !== -1) {\n        ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y);\n      }\n    }\n  }\n  ctx.stroke();\n\n  ctx.textAlign = 'center';\n  ctx.fillStyle = COLORS.energy;\n  ctx.font = `600 ${Math.max(14, cellSize * 0.5)}px sans-serif`;\n  ctx.globalAlpha = 0.42;\n  energyPalaces.forEach(palaceIndex => {\n    const palaceCol = palaceIndex % palaceCols;\n    const palaceRow = Math.floor(palaceIndex / palaceCols);\n    if (state.board[palaceRow * 3 + 1][palaceCol * 3 + 1] !== 0) return;\n    const centerX = boardX + (palaceCol * 3 + 1.5) * cellSize;\n    const centerY = boardY + (palaceRow * 3 + 1.5) * cellSize;\n    ctx.fillText('✦', centerX, centerY + cellSize * 0.17);\n  });\n  ctx.globalAlpha = 1;\n  const near=nearbyEnergy(state);\n  if(near){\n    ctx.strokeStyle=COLORS.energyText;ctx.lineWidth=2;\n    roundedRect(ctx,boardX+near.c*cellSize+1,boardY+near.r*cellSize+1,cellSize*3-2,cellSize*3-2,7);ctx.stroke();\n  }\n}\n\nfunction drawBlocked(ctx, layout, state) {\n  const { boardX, boardY, cellSize } = layout;\n  const board = state.board;\n  const gap = 2.5;\n  const style = state.challenge ? 'stone' : MODES[state.mode].blockedStyle || 'slab';\n  if (style === 'stone') {\n    const radius = (cellSize - gap * 2) * 0.36;\n    board.forEach((boardRow, row) => boardRow.forEach((value, col) => {\n      if (value !== 2) return;\n      if(state.challenge && ((state.challenge.flowers || []).some(([c,r])=>c===col && r===row)\n        || (state.challenge.gates || []).some(gate=>gate.cells.some(([c,r])=>c===col&&r===row))))return;\n      const cx = boardX + (col + 0.5) * cellSize;\n      const cy = boardY + (row + 0.5) * cellSize;\n      ctx.globalAlpha = 0.12;\n      ctx.fillStyle = COLORS.text;\n      ctx.beginPath();\n      ctx.arc(cx, cy + 1.2, radius, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.globalAlpha = 1;\n      const shade = ctx.createRadialGradient\n        ? ctx.createRadialGradient(cx - radius * 0.35, cy - radius * 0.4, radius * 0.1, cx, cy, radius)\n        : null;\n      if (shade && shade.addColorStop) {\n        shade.addColorStop(0, COLORS.stoneLight);\n        shade.addColorStop(1, COLORS.stone);\n        ctx.fillStyle = shade;\n      } else ctx.fillStyle = COLORS.stone;\n      ctx.beginPath();\n      ctx.arc(cx, cy, radius, 0, Math.PI * 2);\n      ctx.fill();\n    }));\n    return;\n  }\n  // 按四连通找出每一块禁区；整块是矩形就画成一整块石台，否则逐格画。\n  const seen = board.map(r => r.map(() => false));\n  board.forEach((boardRow, row) => boardRow.forEach((value, col) => {\n    if (value !== 2 || seen[row][col]) return;\n    const cells = [];\n    const stack = [[row, col]];\n    seen[row][col] = true;\n    while (stack.length) {\n      const [r, c] = stack.pop();\n      cells.push([r, c]);\n      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {\n        const nr = r + dr;\n        const nc = c + dc;\n        if (board[nr] && board[nr][nc] === 2 && !seen[nr][nc]) {\n          seen[nr][nc] = true;\n          stack.push([nr, nc]);\n        }\n      });\n    }\n    const rs = cells.map(cell => cell[0]);\n    const cs = cells.map(cell => cell[1]);\n    const r0 = Math.min(...rs);\n    const c0 = Math.min(...cs);\n    const h = Math.max(...rs) - r0 + 1;\n    const w = Math.max(...cs) - c0 + 1;\n    const rects = cells.length === w * h ? [[r0, c0, w, h]] : cells.map(([r, c]) => [r, c, 1, 1]);\n    rects.forEach(([r, c, rw, rh]) => {\n      const x = boardX + c * cellSize + gap;\n      const y = boardY + r * cellSize + gap;\n      const width = rw * cellSize - gap * 2;\n      const height = rh * cellSize - gap * 2;\n      const corner = Math.max(4, cellSize * 0.16);\n      ctx.fillStyle = COLORS.slab;\n      roundedRect(ctx, x, y, width, height, corner);\n      ctx.fill();\n      // 一道浅色内边，让石台读作\"一块完整的实物\"，而不是一片灰色空格。\n      if (width > 16 && height > 16) {\n        ctx.globalAlpha = 0.35;\n        ctx.strokeStyle = COLORS.panel;\n        ctx.lineWidth = 1.5;\n        roundedRect(ctx, x + 4, y + 4, width - 8, height - 8, Math.max(3, corner - 3));\n        ctx.stroke();\n        ctx.globalAlpha = 1;\n      }\n    });\n  }));\n}\n\nfunction drawClearAnimation(ctx, layout, state) {\n  const cells = state.clearingCells;\n  if (!cells || !cells.length) return;\n  const progress = state.clearProgress || 0;\n  if (progress >= 1) return;\n  const { boardX, boardY, cellSize } = layout;\n  const gap = 2.5;\n  const size = cellSize - gap * 2;\n  const shrink = progress * cellSize * 0.34;\n  const radius = Math.max(3, cellSize * 0.12);\n  // 场景层已经把这些格子画成空格底色，这里只叠加收缩淡出的金块。\n  ctx.globalAlpha = Math.max(0, 1 - progress);\n  ctx.fillStyle = COLORS.energy;\n  for (let i = 0; i \u003c cells.length; i += 1) {\n    const x = boardX + cells[i][0] * cellSize + gap + shrink;\n    const y = boardY + cells[i][1] * cellSize + gap + shrink;\n    roundedRect(ctx, x, y, size - shrink * 2, size - shrink * 2, radius);\n    ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n}\n\nfunction drawPlacementPreview(ctx, layout, state) {\n  if (!state.drag || !state.drag.target || !state.drag.valid) return;\n  const { boardX, boardY, cellSize } = layout;\n  const { shape, target } = state.drag;\n  dragPlacement.drawLanding(ctx, layout,\n    shape.cells.map(([dx, dy]) => [target.col + dx, target.row + dy]), COLORS.block);\n  // Preview the cells removed by this placement; later gravity chains are resolved after release.\n  dragPlacement.drawLanding(ctx, layout, state.drag.previewClearingCells || [], COLORS.clearGlow, 0.6);\n  for (const [c,r] of state.drag.previewBreakingIce || []) drawIceCrack(ctx,layout,c,r);\n  const preview=state.drag.challengePreview;\n  if(preview){\n    ctx.save();ctx.strokeStyle='#BE9144';ctx.lineWidth=2;\n    for(const [c,r,left] of preview.wateredFlowers){\n      drawFlower(ctx,boardX+c*cellSize+3,boardY+r*cellSize+3,cellSize-6,left);\n      ctx.strokeStyle='#BE9144';ctx.lineWidth=2;\n      roundedRect(ctx,boardX+c*cellSize+1,boardY+r*cellSize+1,cellSize-2,cellSize-2,5);ctx.stroke();\n    }\n    ctx.setLineDash([3,2]);\n    for(const [c,r] of preview.openedGates){\n      ctx.fillStyle=COLORS.emptyCell;roundedRect(ctx,boardX+c*cellSize+3,boardY+r*cellSize+3,cellSize-6,cellSize-6,4);ctx.fill();ctx.stroke();\n    }\n    ctx.restore();\n    const notes=[];\n    if(preview.won)notes.push('将完成目标');\n    else if(preview.progressGain>0)notes.push(`目标 +${preview.progressGain}`);\n    else if(preview.progressGain\u003c0)notes.push(`待清理多 ${-preview.progressGain} 格`);\n    if(preview.openedGates.length)notes.push(`开启 ${[...new Set(preview.openedGates.map(p=>p[2]))].join('、')} 机关`);\n    if(preview.bloomedFlowers.length)notes.push(`${preview.bloomedFlowers.length} 处开花`);\n    if(preview.wateredFlowers.length>preview.bloomedFlowers.length)notes.push(`浇灌 ${preview.wateredFlowers.length-preview.bloomedFlowers.length} 处`);\n    const x=layout.horizontalPadding,y=layout.goalY;\n    ctx.fillStyle=COLORS.panel;ctx.fillRect(x+8,y+23,layout.width-2*x-16,17);\n    ctx.font='600 11px sans-serif';ctx.fillStyle=COLORS.accent;ctx.textAlign='left';\n    ctx.fillText('落子预览 · '+(notes.join(' · ') || (preview.brokenIce.length?'薄冰破开 · 下方方块保留':'本步不增加目标进度')),x+13,y+35,layout.width-x*2-26);\n  }\n}\n\nfunction drawIceCrack(ctx, layout, col, row, spread = 0) {\n  const size = layout.cellSize, x = layout.boardX+(col+.5)*size, y = layout.boardY+(row+.5)*size;\n  ctx.strokeStyle = COLORS.text; ctx.lineWidth = 1.6;\n  ctx.beginPath();ctx.moveTo(x-3-spread,y-size*.3);ctx.lineTo(x+2+spread,y-1);\n  ctx.lineTo(x-2-spread,y+3);ctx.lineTo(x+3+spread,y+size*.3);ctx.stroke();\n}\n\nfunction drawIceAnimation(ctx, layout, state) {\n  const progress = state.clearProgress || 0;\n  ctx.globalAlpha = 1-progress;\n  for (const [c,r] of state.breakingIce || []) drawIceCrack(ctx,layout,c,r,progress*5);\n  ctx.strokeStyle='#BE9144';ctx.lineWidth=2;\n  for(const [c,r] of state.openingGates || []){\n    const size=layout.cellSize;\n    roundedRect(ctx,layout.boardX+c*size+2,layout.boardY+r*size+2,size-4,size-4,4);ctx.stroke();\n  }\n  ctx.globalAlpha = 1;\n}\n\nfunction drawDraggedShape(ctx, layout, state) {\n  dragPlacement.drawHeld(ctx, layout.cellSize, state.drag, COLORS.block);\n}\n\nfunction drawMechanicGuide(ctx,layout,state) {\n  const guide=state.mechanicGuide,{panel,skip}=mechanicGuide.rects(layout,guide,state.challenge);\n  const p=guide.progress || 0,[c,r]=guide.cell,s=layout.cellSize;\n  ctx.save();ctx.strokeStyle='#BE9144';ctx.lineWidth=2+Math.sin(p*Math.PI*4);\n  roundedRect(ctx,layout.boardX+c*s+1,layout.boardY+r*s+1,s-2,s-2,5);ctx.stroke();\n  if(guide.id==='flowers')for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){\n    if(c+dx\u003c0||c+dx>8||r+dy\u003c0||r+dy>8)continue;\n    ctx.globalAlpha=.12+.1*Math.sin(p*Math.PI*4);ctx.fillStyle='#BE9144';\n    roundedRect(ctx,layout.boardX+(c+dx)*s+2,layout.boardY+(r+dy)*s+2,s-4,s-4,4);ctx.fill();\n  }\n  if(guide.collapsed){ctx.restore();return;}\n  ctx.globalAlpha=.97;ctx.fillStyle=COLORS.panel;roundedRect(ctx,panel.x,panel.y,panel.width,panel.height,14);ctx.fill();\n  ctx.globalAlpha=1;ctx.strokeStyle=COLORS.boardEdge;ctx.lineWidth=1;ctx.stroke();\n  text(ctx,guide.title,panel.x+12,panel.y+23,13,COLORS.text,'left','600');\n  text(ctx,'跳过 econdaryText);\n    return;\n  }\n  if (state.luckyPendingCount > 0) {\n    ctx.textAlign = 'center';\n    ctx.fillStyle = COLORS.secondaryText;\n    ctx.font = '600 13px sans-serif';\n    const queued = state.luckyPendingCount > 1 ? ` · 待领 ${state.luckyPendingCount} 个` : '';\n    ctx.fillText(`✦ 下一组获得幸运方块${queued}`, layout.width / 2, layout.energyY + 5);\n    return;\n  }\n  ctx.textAlign = 'right';\n  ctx.fillStyle = COLORS.secondaryText;\n  ctx.font = '600 13px sans-serif';\n  ctx.fillText('✦ 能量', layout.width / 2 - 24, layout.energyY + 5);\n  ctx.textAlign = 'center';\n  for (let i = 0; i \u003c 3; i += 1) {\n    const cx = layout.width / 2 + i * 24 - 8;\n    ctx.beginPath();\n    if (i \u003c state.energy) {\n      ctx.arc(cx, layout.energyY, 6, 0, Math.PI * 2);\n      ctx.fillStyle = COLORS.energy;\n      ctx.fill();\n    } else {\n      // 未点亮画空心圈：亮 / 暗靠形状区分，全色盲下两者明度只差 7。\n      ctx.arc(cx, layout.energyY, 5.25, 0, Math.PI * 2);\n      ctx.strokeStyle = COLORS.energyRing;\n      ctx.lineWidth = 1.5;\n      ctx.stroke();\n    }\n  }\n}\n\nfunction shapeBounds(shape) {\n  return shape.cells.reduce((bounds, cell) => ({\n    width: Math.max(bounds.width, cell[0] + 1),\n    height: Math.max(bounds.height, cell[1] + 1)\n  }), { width: 0, height: 0 });\n}\n\nfunction drawSuggestion(ctx, layout, state) {\n  const move=state.suggestion || mechanicGuide.move(state.mechanicGuide,state.challenge),piece=move&&state.tray[move.slot];\n  if(!piece || state.gameOver)return;\n  ctx.save();ctx.strokeStyle=COLORS.accent;ctx.lineWidth=2;ctx.setLineDash([4,3]);\n  for(const [x,y] of piece.cells) {\n    roundedRect(ctx,layout.boardX+(move.c+x)*layout.cellSize+2,layout.boardY+(move.r+y)*layout.cellSize+2,layout.cellSize-4,layout.cellSize-4,4);ctx.stroke();\n  }\n  const center=layout.horizontalPadding+layout.traySlotWidth*(move.slot+.5);\n  roundedRect(ctx,center-layout.traySlotWidth/2+5,layout.trayY-38,layout.traySlotWidth-10,76,10);ctx.stroke();ctx.restore();\n}\n\n// Reuse the actual board symbols in a read-only result thumbnail, including remaining pieces.\nfunction drawResultBoard(ctx, layout, state, rect) {\n  if (rect.height \u003c 40) return;\n  const scale=Math.min((rect.width-76)/(layout.boardWidth+14),rect.height/(layout.boardHeight+14));\n  const width=(layout.boardWidth+14)*scale,x=rect.x+(rect.width-width-68)/2;\n  ctx.save();ctx.translate(x+7*scale,rect.y+7*scale);ctx.scale(scale,scale);\n  ctx.translate(-layout.boardX,-layout.boardY);drawBoard(ctx,layout,state);ctx.restore();\n  const trayX=x+width+12,slotHeight=rect.height/3;\n  state.tray.forEach((shape,index)=>{\n    if(!shape)return;\n    const bounds=shapeBounds(shape),cell=Math.min(12,48/bounds.width,(slotHeight-5)/bounds.height);\n    ctx.fillStyle=COLORS.block;\n    shape.cells.forEach(([c,r])=>{\n      roundedRect(ctx,trayX+(48-bounds.width*cell)/2+c*cell,rect.y+index*slotHeight+(slotHeight-bounds.height*cell)/2+r*cell,cell-1,cell-1,2);ctx.fill();\n    });\n  });\n}\n\nfunction drawTray(ctx, layout, state) {\n  const blockSize = layout.trayBlockSize;\n  const entrance = state.trayAppearProgress == null ? 1 : state.trayAppearProgress;\n  const scale = 0.72 + entrance * 0.28;\n\n  state.tray.forEach((shape, index) => {\n    // 空槽和拖起方块后仍保留底板；不改变原有命中范围。\n    ctx.fillStyle = state.drag && state.drag.trayIndex === index ? COLORS.traySelected : COLORS.trayBackground;\n    roundedRect(ctx, layout.horizontalPadding + index * layout.traySlotWidth + 4,\n      layout.trayY - layout.trayHitHalfHeight, layout.traySlotWidth - 8, layout.trayHitHalfHeight * 2, 16);\n    ctx.fill();\n    if (!shape || (state.drag && state.drag.trayIndex === index)) return;\n    const centerX = layout.horizontalPadding + layout.traySlotWidth * (index + 0.5);\n    const bounds = shapeBounds(shape);\n    const scaledBlockSize = Math.min(blockSize * scale,\n      (layout.traySlotWidth - 8) / bounds.width, 84 / bounds.height);\n    const startX = centerX - bounds.width * scaledBlockSize / 2;\n    const startY = layout.trayY - bounds.height * scaledBlockSize / 2;\n    const unavailable = Boolean(state.unavailableTray && state.unavailableTray[index]);\n    const highlighted = shape.lucky && state.luckyHighlightUntil > 0;\n\n    // 不可放置状态保持接近实色；透明度过低会与米灰背景混合成禁区灰。\n    ctx.globalAlpha = entrance * (unavailable ? 0.94 : 1);\n    ctx.fillStyle = unavailable ? COLORS.alert : (highlighted ? COLORS.energy : COLORS.block);\n    shape.cells.forEach(([x, y]) => {\n      roundedRect(ctx, startX + x * scaledBlockSize + 1.5, startY + y * scaledBlockSize + 1.5,\n        scaledBlockSize - 3, scaledBlockSize - 3, 4);\n      ctx.fill();\n    });\n    if (highlighted) {\n      ctx.textAlign = 'center';\n      ctx.font = '600 12px sans-serif';\n      ctx.fillStyle = COLORS.secondaryText;\n      ctx.fillText('✦ 幸运', centerX, startY + bounds.height * scaledBlockSize + 16);\n    }\n    if (unavailable) {\n      // 浅色斜线压在砖红上，比深红斜线更柔和，也更醒目。\n      ctx.strokeStyle = COLORS.panel;\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(startX + 2, startY + bounds.height * scaledBlockSize - 2);\n      ctx.lineTo(startX + bounds.width * scaledBlockSize - 2, startY + 2);\n      ctx.stroke();\n    }\n    ctx.globalAlpha = 1;\n  });\n}\n\nmodule.exports = { \n  nearbyEnergy,\n  drawBoard,\n  drawResultBoard,\n  drawClearAnimation,\n  drawPlacementPreview,\n  drawIceAnimation,\n  drawDraggedShape,\n  drawMechanicGuide,\n  drawEnergy,\n  drawSuggestion,\n  drawTray\n };\n","./js/views/canvas-ui":"const { COLORS } = require('../config');\n\nfunction roundedRect(ctx, x, y, width, height, radius) {\n  const r = Math.min(radius, width / 2, height / 2);\n  if (ctx.roundRect) {\n    ctx.beginPath();\n    ctx.roundRect(x, y, width, height, r);\n    ctx.closePath();\n    return;\n  }\n  ctx.beginPath();\n  ctx.moveTo(x + r, y);\n  ctx.arcTo(x + width, y, x + width, y + height, r);\n  ctx.arcTo(x + width, y + height, x, y + height, r);\n  ctx.arcTo(x, y + height, x, y, r);\n  ctx.arcTo(x, y, x + width, y, r);\n  ctx.closePath();\n}\n\nfunction text(ctx, value, x, y, size=14, color=COLORS.text, align='center', weight='400') {\n  ctx.font = `${weight} ${size}px sans-serif`; ctx.fillStyle=color; ctx.textAlign=align;\n  ctx.fillText(String(value),x,y);\n}\n\nfunction pressedRect(state, id, rect) {\n  if (!state || state.pressedButton !== id) return rect;\n  const scale = 0.95;\n  const width = rect.width * scale;\n  const height = rect.height * scale;\n  return {\n    x: rect.x + (rect.width - width) / 2,\n    y: rect.y + (rect.height - height) / 2 + 1.5,\n    width,\n    height\n  };\n}\n\nfunction button(ctx,rect,label,primary=false,state=null,id='',fontSize=16) {\n  rect = pressedRect(state, id, rect);\n  ctx.fillStyle=primary?COLORS.primaryButton:COLORS.panel;\n  roundedRect(ctx,rect.x,rect.y,rect.width,rect.height,16);ctx.fill();\n  text(ctx,label,rect.x+rect.width/2,rect.y+rect.height/2+6,fontSize,primary?COLORS.onPrimary:COLORS.text,'center','600');\n}\n\nfunction drawSettingsIcon(ctx, rect, color) {\n  const cx = rect.x + rect.width / 2;\n  const cy = rect.y + rect.height / 2;\n  ctx.strokeStyle = color;\n  ctx.fillStyle = color;\n  ctx.lineWidth = 1.8;\n  ctx.lineCap = 'round';\n  [-7, 0, 7].forEach((offset, index) => {\n    ctx.beginPath();\n    ctx.moveTo(cx - 10, cy + offset);\n    ctx.lineTo(cx + 10, cy + offset);\n    ctx.stroke();\n    ctx.beginPath();\n    ctx.arc(cx + [-3, 5, -1][index], cy + offset, 2.5, 0, Math.PI * 2);\n    ctx.fill();\n  });\n}\n\nfunction wrapText(ctx,value,x,y,width,size=12) {\n  ctx.font=`${size}px sans-serif`;\n  let line='';\n  for(const char of value){\n    const measured=ctx.measureText(line+char),length=measured&&Number.isFinite(measured.width)?measured.width:(line.length+1)*size;\n    if(line && length>width){text(ctx,line,x,y,size,COLORS.secondaryText,'left');y+=18;line='';}\n    line+=char;\n  }\n  if(line)text(ctx,line,x,y,size,COLORS.secondaryText,'left');\n  return y+24;\n}\n\nmodule.exports = { roundedRect, text, pressedRect, button, drawSettingsIcon, wrapText };\n","./js/views/drag-placement":"const { roundedRect } = require('./canvas-ui');\n\n// Both game modes use the same lift, center anchor and grid snapping.\nfunction position(point, bounds, layout) {\n  const { cellSize, boardX, boardY, boardWidth, boardHeight } = layout;\n  const x = point.x, y = point.y - Math.min(86, cellSize * 2.2);\n  const left = x - bounds.width * cellSize / 2, top = y - bounds.height * cellSize / 2;\n  const col = Math.round((left - boardX) / cellSize), row = Math.round((top - boardY) / cellSize);\n  const nearBoard = left > boardX - cellSize && top > boardY - cellSize\n    && left \u003c boardX + boardWidth && top \u003c boardY + boardHeight;\n  return { x, y, target: nearBoard ? { col, row } : null };\n}\n\nfunction drawLanding(ctx, layout, cells, color, alpha = 0.8) {\n  ctx.globalAlpha = alpha;\n  ctx.fillStyle = color;\n  for (const [col, row] of cells) {\n    roundedRect(ctx, layout.boardX + col * layout.cellSize + 2.5,\n      layout.boardY + row * layout.cellSize + 2.5, layout.cellSize - 5, layout.cellSize - 5, 5);\n    ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n}\n\nfunction drawHeld(ctx, cellSize, drag, color) {\n  if (!drag) return;\n  const left = drag.x - drag.bounds.width * cellSize / 2;\n  const top = drag.y - drag.bounds.height * cellSize / 2;\n  // The held piece stays solid even outside the board or over an invalid landing.\n  ctx.globalAlpha = 0.92;\n  ctx.fillStyle = color;\n  for (const [col, row] of drag.shape.cells) {\n    roundedRect(ctx, left + col * cellSize + 2.5, top + row * cellSize + 2.5,\n      cellSize - 5, cellSize - 5, 6);\n    ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n}\n\nmodule.exports = { position, drawLanding, drawHeld };\n","./js/views/layout":"function createLayout(width, height, safeArea, menuButtonRect, mode = { rows: 9, cols: 9 }) {\n  const safeTop = safeArea && typeof safeArea.top === 'number' ? safeArea.top : 0;\n  const safeBottom = safeArea && ty
